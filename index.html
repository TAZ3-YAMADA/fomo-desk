<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desk">
  <meta name="description" content="Trading desk">
  <title>Desk</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <h1 class="sr">Desk</h1>
    <p id="banner" class="banner" role="status" aria-live="polite" hidden></p>
    <main class="main">
      <section id="view-home" role="tabpanel" aria-labelledby="tab-home">
        <h2 class="eyebrow">Portfolio</h2>
        <p id="hero-value" class="hero">—</p>
        <p id="hero-change" class="change">—</p>
        <div class="chart">
          <canvas id="chart" aria-label="Equity chart" role="img"></canvas>
          <p id="chart-empty" class="chart-empty">No chart yet</p>
        </div>
        <h3 class="section-label">Positions</h3>
        <div id="positions" class="list"></div>
      </section>

      <section id="view-agents" role="tabpanel" aria-labelledby="tab-agents" hidden>
        <h2 class="view-title">Agents</h2>
        <div id="agents" class="list"></div>
      </section>

      <section id="view-activity" role="tabpanel" aria-labelledby="tab-activity" hidden>
        <h2 class="view-title">Activity</h2>
        <div id="activity" class="list"></div>
      </section>

      <section id="view-account" role="tabpanel" aria-labelledby="tab-account" hidden>
        <h2 class="view-title">Account</h2>
        <div class="group">
          <h3>Status</h3>
          <div class="kv"><span>Link</span><span id="account-link">Not linked</span></div>
          <div class="kv"><span>Cash</span><span id="account-cash">—</span></div>
          <div class="kv"><span>Last refresh</span><span id="account-refresh">—</span></div>
        </div>
        <div class="group">
          <h3>This device</h3>
          <div class="kv"><span>Display</span><span id="account-display">Browser</span></div>
          <button id="account-install" class="row-btn" type="button" hidden>Install</button>
          <button id="account-forget" class="row-btn" type="button" hidden>Forget link</button>
        </div>
      </section>
    </main>

    <nav class="tabs" role="tablist" aria-label="Desk">
      <button id="tab-home" type="button" role="tab" aria-selected="true" aria-controls="view-home">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M4.5 10.6 12 4.5l7.5 6.1V19a1.2 1.2 0 0 1-1.2 1.2h-4.1v-5.4H9.8v5.4H5.7A1.2 1.2 0 0 1 4.5 19z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        Home
      </button>
      <button id="tab-agents" type="button" role="tab" aria-selected="false" aria-controls="view-agents" tabindex="-1">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <circle cx="12" cy="7.2" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="6.6" cy="16.2" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.4" cy="16.2" r="2.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 9.4v2.1M10.7 12.5 8.2 14.2M13.3 12.5l2.5 1.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Agents
      </button>
      <button id="tab-activity" type="button" role="tab" aria-selected="false" aria-controls="view-activity" tabindex="-1">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M5 7.5h14M5 12h14M5 16.5h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Activity
      </button>
      <button id="tab-account" type="button" role="tab" aria-selected="false" aria-controls="view-account" tabindex="-1">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <circle cx="12" cy="8.6" r="3.1" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5.6 18.8c1.15-2.55 3.4-3.9 6.4-3.9s5.25 1.35 6.4 3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Account
      </button>
    </nav>
  </div>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
